databases:
  - name: swamiverse-db
    databaseName: swamiverse_restaurant
    user: swamiverse
    plan: free
    region: oregon

services:
  # 1. Swamiverse API (NestJS + Socket.IO + Prisma)
  - type: web
    name: swamiverse-api
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/v1/auth/setup-status
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: swamiverse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: PORT
        value: 4000
      - key: COOKIE_SECURE
        value: "true"

  # 2. Swamiverse Web (Next.js App Router)
  - type: web
    name: swamiverse-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: BACKEND_URL
        value: http://swamiverse-api:4000
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
