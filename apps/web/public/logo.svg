<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="swamiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#0f0728" />
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGlow)" stroke="#9333ea" stroke-width="2.5" />

  <!-- Outer cosmic spiral ring -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="url(#swamiGrad)" stroke-width="2" stroke-dasharray="140 30" opacity="0.8" />
  
  <!-- Food Cloche Cover -->
  <path d="M26 62 Q50 24 74 62 Z" fill="none" stroke="url(#swamiGrad)" stroke-width="3.5" stroke-linecap="round" />
  <!-- Cloche Top Knob -->
  <circle cx="50" cy="28" r="4" fill="none" stroke="url(#swamiGrad)" stroke-width="3" />
  <!-- Plate Base -->
  <line x1="22" y1="68" x2="78" y2="68" stroke="url(#swamiGrad)" stroke-width="3.5" stroke-linecap="round" />
  <!-- Plate Curve Bottom -->
  <path d="M25 68 C35 75 65 75 75 68" fill="none" stroke="url(#swamiGrad)" stroke-width="2.5" stroke-linecap="round" />
</svg>
